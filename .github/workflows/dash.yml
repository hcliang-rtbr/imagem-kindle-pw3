name: Gerar dashboard

on:
  schedule:
    # A cada 30 minutos. Horarios em UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # permite rodar manualmente pelo botao "Run workflow"

permissions:
  contents: write           # necessario para commitar a imagem

# Impede que duas execucoes rodem ao mesmo tempo e colidam no push.
concurrency:
  group: gerar-dashboard
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pillow requests

      - name: Gerar a imagem
        run: python generate_dash.py

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dash.png
          if git diff --staged --quiet; then
            echo "Nada mudou, nada a commitar."
          else
            git commit -m "dash: atualizacao automatica $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
